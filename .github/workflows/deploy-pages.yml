name: Deploy Terra to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            status=$(curl --silent --location --output /tmp/geomap.html --write-out "%{http_code}" "$SITE_URL")
            if [ "$status" = "200" ] && grep --quiet "Country Club — World Field Guide" /tmp/geomap.html; then
              asset_path=$(grep --only-matching --extended-regexp 'src="[^"]+\.js"' /tmp/geomap.html | head -1 | cut -d'"' -f2)
              curl --fail --silent --show-error "https://jarjarbinks37.github.io${asset_path}" --output /dev/null
              echo "Verified $SITE_URL and ${asset_path}"
              exit 0
            fi
            echo "Attempt $attempt: site returned HTTP $status; retrying..."
            sleep 10
          done
          echo "Published site did not become ready in time."
          exit 1
